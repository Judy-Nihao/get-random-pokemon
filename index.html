<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- axios -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.4.0/axios.min.js" defer></script>
    <!-- html to canvas -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js" defer></script>
    <!-- custom js -->
    <script src="js/all.js" defer></script>
    <!-- icon css -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- custom css -->
    <link rel="stylesheet" href="css/style.css">
    <title>寶可夢圖鑑卡</title>
</head>
<body>
    <main class="container">
        <header class="intro">
            <h1 lang="en">Click to Get<br>a Pokemon</h1>
        </header>
        <section class="card-stage" aria-label="寶可夢卡片">
            <div id="card" class="card" role="button" tabindex="0" aria-label="顯示寶可夢背面" aria-busy="true" data-entryText="關於這隻寶可夢還有許多未知"></div>
            <div class="flip"><span>點擊卡片翻轉</span><img src="img/flip_FILL0_wght400_GRAD0_opsz48 (1).png" alt=""></div>
        </section>
        <section class="controls" aria-label="卡片操作">
            <div class="generate">
                <button id="btn" class="btn" type="button" aria-label="Get a random Pokemon" disabled>
                    <span class="ball-button" aria-hidden="true"></span>
                </button>
            </div>
            <button class="download" type="button" disabled><i class="bx bx-download" aria-hidden="true"></i><span>Download Card</span></button>
            <p id="load-status" class="load-status" role="status" aria-live="polite">載入中…</p>
            <button id="retry" class="retry" type="button" hidden>重試</button>
        </section>
    </main>
</body>
</html>
